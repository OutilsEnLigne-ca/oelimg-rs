[package]
name = "oelimg-rs"
version = "0.1.0"
edition = "2024"
authors = ["OutilsEnLigne.ca"]
description = "Librairie d'édition d'images extensive pour WASM"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "webp"] }
fast_image_resize = "3.0"
# Note: j'ai de la misere avec photon-rs, j'utilises les filters de la crate image a place
# photon-rs = { version = "0.3", default-features = false }
js-sys = "0.3"
web-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

# Tell `rustc` to optimize for small code size.
[profile.release]
opt-level = "s"
lto = true

[package.metadata.wasm-pack.profile.release]
# Tell wasm-pack to append these to the generated package.json
[package.metadata.wasm-pack.profile.release.wasm-bindgen]
# Remove debug symbols for smaller file size
debug-assertions = false